<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Rekod Penggunaan </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #0f3d57;
      --brand-strong: #0b2f43;
      --accent: #cc8f34;
      --surface: #ffffff;
      --surface-soft: #f5f8fb;
      --surface-strong: #eaf1f6;
      --danger: #b3261e;
      --success: #1f6f43;
      --text: #1e2a34;
      --muted: #586774;
      --border: #cfdce6;
      --shadow: 0 20px 40px rgba(8, 47, 67, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 480px at 0% -8%, rgba(15, 61, 87, 0.16), transparent 74%),
        radial-gradient(950px 420px at 100% 0%, rgba(204, 143, 52, 0.15), transparent 68%),
        linear-gradient(180deg, #eff4f8 0%, #edf3f7 100%);
      padding: 28px 14px 38px;
      overflow-x: hidden;
    }

    .layout {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 930px) 320px;
      gap: 16px;
      align-items: start;
      justify-content: center;
    }

    .page {
      background: var(--surface);
      border: 1px solid rgba(11, 47, 67, 0.1);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: pageEnter 420ms ease;
    }

    .header {
      background: linear-gradient(120deg, var(--brand-strong) 0%, var(--brand) 80%);
      color: #fff;
      padding: 24px 26px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.2;
      font-family: "IBM Plex Serif", Georgia, serif;
      letter-spacing: 0.1px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .content {
      padding: 22px;
    }

    .main-form {
      min-width: 0;
    }

    .history-panel {
      border: 1px solid #dce6ee;
      border-radius: 12px;
      background: linear-gradient(180deg, #f8fcff 0%, #f2f8fc 100%);
      padding: 12px;
      position: sticky;
      top: 16px;
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .history-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--brand-strong);
      letter-spacing: 0.15px;
    }

    .btn-refresh {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 7px;
      background: #eaf2f8;
      color: var(--brand-strong);
      border: 1px solid rgba(11, 47, 67, 0.14);
    }

    .history-hint {
      margin: 0 0 9px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .history-scroll {
      max-height: 440px;
      overflow: auto;
      border: 1px solid #d4e2ec;
      border-radius: 8px;
      background: #fff;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .history-table th,
    .history-table td {
      padding: 7px 8px;
      text-align: left;
      border-bottom: 1px solid #ecf2f7;
      vertical-align: top;
      white-space: nowrap;
    }

    .history-table th {
      background: #f3f8fc;
      color: #3a5161;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .history-empty {
      padding: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .history-error {
      color: #9d3028;
      font-weight: 700;
    }

    .identity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .field {
      margin: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: var(--brand-strong);
      font-size: 0.95rem;
      letter-spacing: 0.1px;
    }

    input,
    select,
    .dropdown-input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 1rem;
      color: var(--text);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    input:focus,
    select:focus,
    .dropdown-input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 61, 87, 0.13);
    }

    .section-title {
      margin: 2px 0 10px;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--brand-strong);
      letter-spacing: 0.1px;
    }

    .section-subtitle {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .install-callout {
      margin: 0 0 14px;
      padding: 12px;
      border-radius: 11px;
      border: 1px solid #d4e1eb;
      background: linear-gradient(180deg, #f8fcff 0%, #f1f7fb 100%);
      display: grid;
      gap: 7px;
    }

    .install-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--brand-strong);
    }

    .install-copy {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .btn-install {
      justify-self: start;
      background: #e5eef5;
      color: var(--brand-strong);
      border: 1px solid rgba(8, 55, 76, 0.18);
      font-size: 0.9rem;
      padding: 9px 12px;
    }

    .item-row {
      display: grid;
      grid-template-columns: minmax(240px, 1.2fr) 170px 130px 110px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      padding: 12px;
      background: var(--surface-soft);
      border: 1px solid #dce6ee;
      border-radius: 10px;
      animation: rowEnter 260ms ease;
    }

    .row-header {
      display: grid;
      grid-template-columns: minmax(240px, 1.2fr) 170px 130px 110px;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.25px;
      text-transform: uppercase;
      padding: 0 3px;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #c8d8e4;
      border-radius: 9px;
      box-shadow: 0 14px 28px rgba(11, 47, 67, 0.16);
      z-index: 30;
      padding: 6px;
    }

    .dropdown-item {
      width: 100%;
      text-align: left;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      padding: 8px 9px;
      font-weight: 500;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: #e9f1f7;
    }

    .dropdown-empty {
      color: var(--muted);
      font-size: 0.92rem;
      padding: 8px 9px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 13px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover { filter: brightness(1.04); }
    button:active { transform: translateY(1px); }

    .btn-remove {
      background: #faefee;
      color: #9d3028;
      border: 1px solid rgba(179, 38, 30, 0.2);
    }

    .btn-add {
      margin-top: 6px;
      margin-bottom: 8px;
      background: #eef4f8;
      color: var(--brand-strong);
      border: 1px solid rgba(8, 55, 76, 0.15);
    }

    .btn-submit {
      width: 100%;
      margin-top: 4px;
      padding-top: 13px;
      padding-bottom: 13px;
      background: linear-gradient(120deg, var(--brand-strong) 0%, var(--brand) 100%);
      color: #fff;
      letter-spacing: 0.2px;
    }

    .btn-submit[disabled] {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      margin-top: 14px;
      border-radius: 10px;
      padding: 12px 13px;
      font-weight: 600;
      border: 1px solid transparent;
      display: none;
    }

    .message.show { display: block; }
    .message.info {
      color: #0b4f6c;
      border-color: rgba(11, 79, 108, 0.2);
      background: #e9f4f9;
    }
    .message.success {
      color: var(--success);
      border-color: rgba(31, 111, 67, 0.2);
      background: #eaf7ef;
    }
    .message.error {
      color: var(--danger);
      border-color: rgba(179, 38, 30, 0.24);
      background: #fbeceb;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .meta-footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #dce6ee;
      display: grid;
      gap: 12px;
    }

    .meta-label {
      margin: 0 0 6px;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .developer-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--brand-strong);
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #d5e2eb;
      background: #f9fcfe;
      border-radius: 999px;
      padding: 7px 12px;
      width: fit-content;
    }

    .developer-link:hover {
      background: #eef5fa;
    }

    .techstack-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .techstack-badges img {
      height: 24px;
      border-radius: 5px;
      border: 1px solid rgba(11, 47, 67, 0.1);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .qty-cell {
      display: grid;
      gap: 4px;
    }

    .balance-note {
      font-size: 0.78rem;
      line-height: 1.3;
      font-weight: 600;
    }

    .balance-loading {
      color: #0b4f6c;
    }

    .balance-ok {
      color: #1f6f43;
    }

    .balance-warning {
      color: #b3261e;
    }

    .balance-error {
      color: #9d3028;
    }

    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rowEnter {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
        max-width: 930px;
      }

      .history-panel {
        position: static;
      }
    }

    @media (max-width: 860px) {
      .row-header {
        display: none;
      }

      .item-row {
        grid-template-columns: 1fr;
      }

      .btn-remove {
        width: 100%;
      }

      .actions {
        justify-content: stretch;
      }

      .btn-add {
        width: 100%;
      }
    }

    @media (max-width: 740px) {
      body {
        padding: 16px 10px 24px;
      }

      .header {
        padding: 18px 16px;
      }

      .header h1 {
        font-size: 1.35rem;
      }

      .content {
        padding: 16px;
      }

      .layout {
        max-width: 930px;
      }

      .history-panel,
      .history-scroll {
        max-width: 100%;
      }

      .identity-grid {
        grid-template-columns: 1fr;
      }

      .history-table {
        font-size: 0.76rem;
      }

      .history-table th,
      .history-table td {
        white-space: normal;
      }

      .btn-install {
        width: 100%;
        justify-self: stretch;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwXC8y3wc-IL23cHtgVriOtjeH0GsaxEXRsttsuRkilLry7xZ-WWstvLlo6b1WH3E0k/exec";

    let rowCounter = 0;

    function createEmptyItem() {
      rowCounter += 1;
      return {
        id: rowCounter,
        material: "",
        kuantiti: "",
        unit: "",
        balance: null,
        balanceUnit: "",
        balanceStatus: "idle",
      };
    }

    const UNIT_OPTIONS = [
      "KG",
      "G",
      "TON",
      "PCS",
      "UNIT",
      "LITER",
      "ML",
      "METER",
      "CM",
      "ROLL",
      "SET",
      "BUNDLE",
      "PACK",
      "PAIR",
      "DOZEN"
    ];

    function MaterialDropdown({ value, options, onChange, placeholder }) {
      const [query, setQuery] = useState(value || "");
      const [isOpen, setIsOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        setQuery(value || "");
      }, [value]);

      useEffect(() => {
        function handleClickOutside(event) {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const filteredOptions = useMemo(() => {
        const search = (query || "").trim().toLowerCase();
        if (!search) {
          return options.slice(0, 12);
        }
        return options
          .filter((option) => option.toLowerCase().includes(search))
          .slice(0, 12);
      }, [query, options]);

      function handleInputChange(event) {
        const nextValue = event.target.value;
        setQuery(nextValue);
        onChange(nextValue);
        setIsOpen(true);
      }

      function handleSelect(selectedValue) {
        setQuery(selectedValue);
        onChange(selectedValue);
        setIsOpen(false);
      }

      return (
        <div className="dropdown" ref={containerRef}>
          <input
            className="dropdown-input"
            type="text"
            value={query}
            placeholder={placeholder}
            onFocus={() => setIsOpen(true)}
            onChange={handleInputChange}
            autoComplete="off"
            required
          />

          {isOpen && (
            <div className="dropdown-menu">
              {filteredOptions.length === 0 ? (
                <div className="dropdown-empty">Tiada padanan. Anda boleh taip material baharu.</div>
              ) : (
                filteredOptions.map((option, index) => (
                  <button
                    type="button"
                    key={option + index}
                    className="dropdown-item"
                    onClick={() => handleSelect(option)}
                  >
                    {option}
                  </button>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [nama, setNama] = useState("");
      const [tujuan, setTujuan] = useState("");
      const [items, setItems] = useState([createEmptyItem()]);
      const [materials, setMaterials] = useState([]);
      const [usageHistory, setUsageHistory] = useState([]);
      const [historyStatus, setHistoryStatus] = useState("idle");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [message, setMessage] = useState({ text: "", type: "info" });
      const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
      const [showInstallCta, setShowInstallCta] = useState(false);
      const [isIosDevice, setIsIosDevice] = useState(false);
      const [isStandaloneMode, setIsStandaloneMode] = useState(false);
      const balanceDebounceRef = useRef({});

      function parseBalancePayload(payload) {
        const toNumber = (value) => {
          if (typeof value === "number" && Number.isFinite(value)) {
            return value;
          }
          if (typeof value === "string") {
            const normalized = value.replace(",", ".").trim();
            const num = Number(normalized);
            return Number.isFinite(num) ? num : null;
          }
          return null;
        };

        if (typeof payload === "number") {
          return { balance: payload, balanceUnit: "" };
        }

        if (typeof payload === "string") {
          const parsed = toNumber(payload);
          return { balance: parsed, balanceUnit: "" };
        }

        if (payload && typeof payload === "object") {
          const balance = toNumber(
            payload.balance ?? payload.baki ?? payload.stok ?? payload.stock ?? payload.quantity ?? payload.kuantiti
          );
          const balanceUnit = String(payload.unit ?? "").trim();
          return { balance, balanceUnit };
        }

        return { balance: null, balanceUnit: "" };
      }

      function updateItemById(itemId, updater) {
        setItems((prev) =>
          prev.map((item) => {
            if (item.id !== itemId) {
              return item;
            }
            const next = typeof updater === "function" ? updater(item) : updater;
            return { ...item, ...next };
          })
        );
      }

      function normalizeHistoryRows(payload) {
        if (!Array.isArray(payload)) {
          return [];
        }

        return payload
          .map((row) => {
            if (row && typeof row === "object" && !Array.isArray(row)) {
              return {
                date: String(row.tarikh ?? row.date ?? row.timestamp ?? "").trim(),
                name: String(row.nama ?? row.name ?? "").trim(),
                material: String(row.material ?? row.item ?? "").trim(),
                qty: String(row.kuantiti ?? row.quantity ?? row.qty ?? "").trim(),
                unit: String(row.unit ?? "").trim(),
              };
            }

            if (Array.isArray(row)) {
              return {
                date: String(row[0] ?? "").trim(),
                name: String(row[1] ?? "").trim(),
                material: String(row[2] ?? "").trim(),
                qty: String(row[3] ?? "").trim(),
                unit: String(row[4] ?? "").trim(),
              };
            }

            return null;
          })
          .filter((row) => row && (row.material || row.name || row.qty))
          .slice(0, 40);
      }

      async function loadUsageHistory() {
        setHistoryStatus("loading");
        try {
          const response = await fetch(`${WEB_APP_URL}?action=getUsageHistory`);

          let payload;
          const contentType = response.headers.get("content-type") || "";
          if (contentType.includes("application/json")) {
            payload = await response.json();
          } else {
            const text = await response.text();
            payload = JSON.parse(text);
          }

          const normalized = normalizeHistoryRows(payload);
          setUsageHistory(normalized);
          setHistoryStatus("ok");
        } catch (error) {
          setUsageHistory([]);
          setHistoryStatus("error");
          console.error("Gagal memuatkan usage history:", error);
        }
      }

      useEffect(() => {
        async function loadMaterialList() {
          try {
            const response = await fetch(WEB_APP_URL + "?action=getMaterials");
            const data = await response.json();
            if (Array.isArray(data)) {
              const cleanData = data
                .map((item) => String(item || "").trim())
                .filter((item) => item !== "");
              setMaterials(cleanData);
            }
          } catch (error) {
            console.error("Gagal memuatkan senarai material:", error);
          }
        }
        loadMaterialList();
        loadUsageHistory();
      }, []);

      useEffect(() => {
        const ua = window.navigator.userAgent || "";
        const ios = /iphone|ipad|ipod/i.test(ua);
        const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

        setIsIosDevice(ios);
        setIsStandaloneMode(Boolean(standalone));

        if (ios && !standalone) {
          setShowInstallCta(true);
        }

        function onBeforeInstallPrompt(event) {
          event.preventDefault();
          setDeferredInstallPrompt(event);
          setShowInstallCta(true);
        }

        function onAppInstalled() {
          setDeferredInstallPrompt(null);
          setShowInstallCta(false);
          setIsStandaloneMode(true);
          setMessage({ text: "Aplikasi ditambah ke Home Screen dengan berjaya.", type: "success" });
        }

        window.addEventListener("beforeinstallprompt", onBeforeInstallPrompt);
        window.addEventListener("appinstalled", onAppInstalled);

        return () => {
          window.removeEventListener("beforeinstallprompt", onBeforeInstallPrompt);
          window.removeEventListener("appinstalled", onAppInstalled);
        };
      }, []);

      useEffect(() => {
        return () => {
          Object.values(balanceDebounceRef.current).forEach((timerId) => clearTimeout(timerId));
        };
      }, []);

      async function fetchItemBalance(itemId, materialName) {
        const material = String(materialName || "").trim();
        if (!material) {
          updateItemById(itemId, {
            balance: null,
            balanceUnit: "",
            balanceStatus: "idle",
          });
          return;
        }

        const normalizedMaterial = material.toLowerCase();

        updateItemById(itemId, {
          balance: null,
          balanceUnit: "",
          balanceStatus: "loading",
        });

        try {
          const response = await fetch(
            `${WEB_APP_URL}?action=getBalanceByMaterial&material=${encodeURIComponent(material)}`
          );

          let payload;
          const contentType = response.headers.get("content-type") || "";
          if (contentType.includes("application/json")) {
            payload = await response.json();
          } else {
            const text = await response.text();
            try {
              payload = JSON.parse(text);
            } catch {
              payload = text;
            }
          }

          const { balance, balanceUnit } = parseBalancePayload(payload);
          if (!Number.isFinite(balance)) {
            throw new Error("Balance format not supported");
          }

          setItems((prev) =>
            prev.map((item) => {
              if (item.id !== itemId) {
                return item;
              }
              if (String(item.material || "").trim().toLowerCase() !== normalizedMaterial) {
                return item;
              }
              return {
                ...item,
                balance,
                balanceUnit,
                balanceStatus: "ok",
              };
            })
          );
        } catch (error) {
          setItems((prev) =>
            prev.map((item) => {
              if (item.id !== itemId) {
                return item;
              }
              if (String(item.material || "").trim().toLowerCase() !== normalizedMaterial) {
                return item;
              }
              return {
                ...item,
                balance: null,
                balanceUnit: "",
                balanceStatus: "error",
              };
            })
          );
        }
      }

      function scheduleBalanceLookup(itemId, materialName) {
        if (balanceDebounceRef.current[itemId]) {
          clearTimeout(balanceDebounceRef.current[itemId]);
        }

        balanceDebounceRef.current[itemId] = setTimeout(() => {
          fetchItemBalance(itemId, materialName);
        }, 360);
      }

      function updateItem(itemId, field, value) {
        updateItemById(itemId, (item) => {
          if (field === "material") {
            return {
              material: value,
              balance: null,
              balanceUnit: "",
              balanceStatus: "idle",
            };
          }
          return { [field]: value };
        });
      }

      function addRow() {
        setItems((prev) => [...prev, createEmptyItem()]);
      }

      function removeRow(itemId) {
        if (balanceDebounceRef.current[itemId]) {
          clearTimeout(balanceDebounceRef.current[itemId]);
          delete balanceDebounceRef.current[itemId];
        }

        setItems((prev) => {
          if (prev.length === 1) {
            setMessage({ text: "Sekurang-kurangnya satu material perlu disenaraikan.", type: "error" });
            return prev;
          }
          return prev.filter((item) => item.id !== itemId);
        });
      }

      async function handleSubmit(event) {
        event.preventDefault();

        if (!nama.trim() || !tujuan.trim()) {
          setMessage({ text: "Sila lengkapkan nama pengguna dan tujuan penggunaan.", type: "error" });
          return;
        }

        const validItems = items
          .map((item) => ({
            material: item.material.trim(),
            kuantiti: Number(item.kuantiti),
            unit: item.unit.trim(),
          }))
          .filter((item) => item.material && item.kuantiti > 0);

        if (validItems.length === 0) {
          setMessage({ text: "Sila isi sekurang-kurangnya satu material dengan kuantiti yang sah.", type: "error" });
          return;
        }

        const pendingBalanceCheck = items.find(
          (item) => item.material.trim() && item.balanceStatus === "loading"
        );
        if (pendingBalanceCheck) {
          setMessage({ text: "Sila tunggu semakan baki material selesai sebelum hantar rekod.", type: "info" });
          return;
        }

        const exceededItem = items.find((item) => {
          const requestedQty = Number(item.kuantiti);
          return (
            item.material.trim() &&
            requestedQty > 0 &&
            item.balanceStatus === "ok" &&
            Number.isFinite(item.balance) &&
            requestedQty > item.balance
          );
        });

        if (exceededItem) {
          const unitLabel = exceededItem.balanceUnit || exceededItem.unit || "unit";
          setMessage({
            text: `Kuantiti melebihi baki untuk ${exceededItem.material}. Baki semasa: ${exceededItem.balance} ${unitLabel}.`,
            type: "error",
          });
          return;
        }

        setIsSubmitting(true);
        setMessage({ text: "Permohonan sedang dihantar. Sila tunggu sebentar...", type: "info" });

        const formData = new FormData();
        formData.append("nama", nama.trim());
        formData.append("tujuan", tujuan.trim());
        formData.append("items", JSON.stringify(validItems));

        try {
          const response = await fetch(WEB_APP_URL, {
            method: "POST",
            body: formData,
          });
          const result = await response.text();

          if (result.includes("Berjaya") || result.includes("Success")) {
            setMessage({ text: result || "Rekod penggunaan material berjaya dihantar.", type: "success" });
            setNama("");
            setTujuan("");
            setItems([createEmptyItem()]);
          } else {
            setMessage({ text: result || "Permohonan tidak berjaya diproses.", type: "error" });
          }
        } catch (error) {
          setMessage({ text: "Ralat sambungan. Sila semak capaian internet dan cuba lagi.", type: "error" });
        } finally {
          setIsSubmitting(false);
        }
      }

      async function handleInstallClick() {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice;

          if (choice.outcome === "accepted") {
            setShowInstallCta(false);
            setMessage({ text: "Aplikasi akan muncul seperti app selepas ditambah ke Home Screen.", type: "success" });
          } else {
            setMessage({ text: "Anda masih boleh tambah app ini dari menu pelayar bila-bila masa.", type: "info" });
          }

          setDeferredInstallPrompt(null);
          return;
        }

        if (isIosDevice) {
          setMessage({
            text: "iPhone/iPad: tekan butang Share di Safari, kemudian pilih 'Add to Home Screen'.",
            type: "info",
          });
        }
      }

      return (
        <main className="layout">
          <section className="page">
            <header className="header">
              <h1>BORANG PEMOHONAN BAHAN GUNA HABIS</h1>
              <p>SISTEM REKOD BAHAN KERJA</p>
            </header>

            <section className="content">
              <form className="main-form" onSubmit={handleSubmit}>
              {!isStandaloneMode && showInstallCta && (
                <div className="install-callout" role="status" aria-live="polite">
                  <p className="install-title">Akses pantas seperti aplikasi</p>
                  <p className="install-copy">
                    {isIosDevice
                      ? "Untuk iPhone/iPad, gunakan Safari dan pilih Share > Add to Home Screen."
                      : "Tambah ke Home Screen supaya sistem ini terbuka seperti aplikasi penuh tanpa bar alamat."}
                  </p>
                  <button
                    type="button"
                    className="btn-install"
                    onClick={handleInstallClick}
                  >
                    {deferredInstallPrompt ? "Tambah ke Home Screen" : "Cara Tambah ke Home Screen"}
                  </button>
                </div>
              )}

              <div className="identity-grid">
                <div className="field">
                  <label htmlFor="nama">NAMA PEMOHON</label>
                  <input
                    id="nama"
                    type="text"
                    placeholder="Contoh: Ahmad Bin Salleh"
                    value={nama}
                    onChange={(event) => setNama(event.target.value)}
                    required
                  />
                </div>

                <div className="field">
                  <label htmlFor="tujuan">TUJUAN PERMOHONAN</label>
                  <input
                    id="tujuan"
                    type="text"
                    placeholder="Contoh: Penyelenggaraan Site A"
                    value={tujuan}
                    onChange={(event) => setTujuan(event.target.value)}
                    required
                  />
                </div>
              </div>

              <p className="section-title">BAHAN YANG DIPERLUKAN</p>
              <p className="section-subtitle">LENGKAPKAN MAKLUMAT BAHAN DIPERLUKAN UNTUK PERMOHONAN INI.</p>

              <div className="row-header">
                <div>Material</div>
                <div>Kuantiti</div>
                <div>Unit</div>
                <div>Tindakan</div>
              </div>

              {items.map((item) => (
                <div className="item-row" key={item.id}>
                  <MaterialDropdown
                    value={item.material}
                    options={materials}
                    onChange={(value) => {
                      updateItem(item.id, "material", value);
                      scheduleBalanceLookup(item.id, value);
                    }}
                    placeholder="Pilih atau taip nama Bahan"
                  />
                  <div className="qty-cell">
                    <input
                      type="number"
                      min="1"
                      placeholder="Kuantiti"
                      value={item.kuantiti}
                      onChange={(event) => updateItem(item.id, "kuantiti", event.target.value)}
                      required
                    />
                    {item.material.trim() && item.balanceStatus === "loading" && (
                      <div className="balance-note balance-loading">Menyemak baki semasa...</div>
                    )}
                    {item.material.trim() && item.balanceStatus === "ok" && (
                      <div className={`balance-note ${Number(item.kuantiti || 0) > item.balance ? "balance-warning" : "balance-ok"}`}>
                        Baki tersedia: {item.balance} {item.balanceUnit || item.unit || ""}
                      </div>
                    )}
                    {item.material.trim() && item.balanceStatus === "error" && (
                      <div className="balance-note balance-error">Baki tidak dapat disemak secara masa nyata.</div>
                    )}
                  </div>
                  <select
                    value={item.unit}
                    onChange={(event) => updateItem(item.id, "unit", event.target.value)}
                  >
                    <option value="">Pilih Unit</option>
                    {UNIT_OPTIONS.map((unit) => (
                      <option key={unit} value={unit}>{unit}</option>
                    ))}
                  </select>
                  <button type="button" className="btn-remove" onClick={() => removeRow(item.id)}>
                    BUANG BAHAN
                  </button>
                </div>
              ))}

              <div className="actions">
                <button type="button" className="btn-add" onClick={addRow}>
                  TAMBAH BAHAN
                </button>
              </div>

              <button className="btn-submit" type="submit" disabled={isSubmitting}>
                {isSubmitting ? "Sedang Dihantar..." : "Hantar Rekod"}
              </button>

              <div className={`message ${message.text ? "show" : ""} ${message.type}`}>
                {message.text}
              </div>

              <p className="hint">Pastikan semua maklumat yang dihantar adalah tepat untuk tujuan rekod stor.</p>

              <div className="meta-footer">
                <div>
                  <p className="meta-label">Developer</p>
                  <a
                    className="developer-link"
                    href="https://github.com/fiqriadam0-source"
                    target="_blank"
                    rel="noreferrer"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.11.79-.25.79-.56v-2.03c-3.2.7-3.88-1.54-3.88-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.76 1.19 1.76 1.19 1.03 1.76 2.71 1.25 3.37.96.11-.75.4-1.25.72-1.54-2.55-.29-5.24-1.27-5.24-5.66 0-1.25.44-2.27 1.18-3.08-.12-.29-.51-1.46.11-3.03 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.57.23 2.74.11 3.03.74.81 1.18 1.83 1.18 3.08 0 4.4-2.69 5.37-5.25 5.65.41.36.77 1.08.77 2.18v3.23c0 .31.21.68.79.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
                    </svg>
                    fiqriadam0-source
                  </a>
                </div>

                <div>
                  <p className="meta-label">Tech Stack</p>
                  <div className="techstack-badges">
                    <img src="https://img.shields.io/badge/HTML5-E34F26?style=for-the-badge&logo=html5&logoColor=white" alt="HTML5" />
                    <img src="https://img.shields.io/badge/CSS3-1572B6?style=for-the-badge&logo=css3&logoColor=white" alt="CSS3" />
                    <img src="https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge&logo=javascript&logoColor=111" alt="JavaScript" />
                    <img src="https://img.shields.io/badge/React-20232A?style=for-the-badge&logo=react&logoColor=61DAFB" alt="React" />
                    <img src="https://img.shields.io/badge/Babel-F9DC3E?style=for-the-badge&logo=babel&logoColor=222" alt="Babel" />
                    <img src="https://img.shields.io/badge/Google_Apps_Script-34A853?style=for-the-badge&logo=googleappsscript&logoColor=white" alt="Google Apps Script" />
                  </div>
                </div>
              </div>
              </form>
            </section>
          </section>

          <aside className="history-panel" aria-label="Rekod penggunaan terkini">
            <div className="history-head">
              <p className="history-title">Usage History</p>
              <button
                type="button"
                className="btn-refresh"
                onClick={loadUsageHistory}
                disabled={historyStatus === "loading"}
              >
                {historyStatus === "loading" ? "Memuat..." : "Refresh"}
              </button>
            </div>

            <p className="history-hint">Maklumat tambahan (optional) untuk rujukan pantas.</p>

            <div className="history-scroll">
              {historyStatus === "error" ? (
                <div className="history-empty history-error">Gagal memuatkan usage history.</div>
              ) : usageHistory.length === 0 ? (
                <div className="history-empty">
                  {historyStatus === "loading" ? "Sedang memuatkan usage history..." : "Tiada data usage history."}
                </div>
              ) : (
                <table className="history-table">
                  <thead>
                    <tr>
                      <th>Tarikh</th>
                      <th>Nama</th>
                      <th>Material</th>
                      <th>Kuantiti</th>
                    </tr>
                  </thead>
                  <tbody>
                    {usageHistory.map((row, index) => (
                      <tr key={`${row.date}-${row.name}-${row.material}-${index}`}>
                        <td>{row.date || "-"}</td>
                        <td>{row.name || "-"}</td>
                        <td>{row.material || "-"}</td>
                        <td>{row.qty || "-"} {row.unit || ""}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </aside>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Gagal daftar service worker:", error);
        });
      });
    }
  </script>
</body>
</html>
