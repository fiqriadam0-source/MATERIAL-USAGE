<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinjam Material - Adam22</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h2 { 
      color: #1a73e8; 
      text-align: center; 
      margin: 10px 0 25px; 
    }

    label { 
      display: block; 
      margin: 15px 0 8px; 
      font-weight: 600; 
      color: #333; 
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus { 
      border-color: #1a73e8; 
      outline: none; 
    }

    .item-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #eee;
      align-items: center;
    }

    .item-row input {
      flex: 1;
      min-width: 120px;
    }

    .kuantiti { max-width: 110px; }
    .unit { max-width: 130px; }

    .remove-btn {
      background: #ea4335;
      color: white;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .add-btn { 
      background: #34a853; 
      color: white; 
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin: 15px 0;
    }

    #submitBtn {
      background: #1a73e8;
      color: white;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      margin-top: 10px;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: 500;
    }

    /* Responsive untuk telefon */
    @media (max-width: 576px) {
      .item-row {
        flex-direction: column;
        align-items: stretch;
      }
      .remove-btn {
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 MATERIALS USAGE FORM</h2>

    <label>Nama Pengguna *</label>
    <input type="text" id="nama" placeholder="Masukkan nama woi" required>

    <label>Tujuan *</label>
    <input type="text" id="tujuan" placeholder="Contoh: Baiki rumah, Projek Site A" required>

    <h3>Barang yang Dipinjam</h3>

    <datalist id="materialList"></datalist>

    <div id="itemsContainer">
      <div class="item-row">
        <input type="text" class="material" list="materialList" placeholder="Nama Material" required>
        <input type="number" class="kuantiti" min="1" placeholder="Kuantiti" required>
        <input type="text" class="unit" placeholder="Unit (pcs, kg, liter)">
        <button type="button" class="remove-btn" onclick="removeRow(this)">Buang</button>
      </div>
    </div>

    <button type="button" class="add-btn" onclick="addItemRow()">+ Tambah Barang</button>
    <button id="submitBtn" onclick="submitForm()">📤 Hantar Pinjaman</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbyP8rKrQFT4Ho0g5lyI51dQZ-VBA-a9iKmELX_qk1D6xKkZ_bYwL9PYxgEKU09qO04f/exec";

    function addItemRow() {
      const container = document.getElementById('itemsContainer');
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <input type="text" class="material" list="materialList" placeholder="Nama Material" required>
        <input type="number" class="kuantiti" min="1" placeholder="Kuantiti" required>
        <input type="text" class="unit" placeholder="Unit (pcs, kg, liter)">
        <button type="button" class="remove-btn" onclick="removeRow(this)">Buang</button>
      `;
      container.appendChild(row);
    }

    function removeRow(btn) {
      if (document.querySelectorAll('.item-row').length > 1) {
        btn.parentElement.remove();
      } else {
        alert("Sekurang-kurangnya satu barang diperlukan.");
      }
    }

    async function submitForm() {
      const nama = document.getElementById('nama').value.trim();
      const tujuan = document.getElementById('tujuan').value.trim();
      const messageDiv = document.getElementById('message');

      if (!nama || !tujuan) {
        messageDiv.style.color = "red";
        messageDiv.textContent = "Sila isi Nama dan Tujuan.";
        return;
      }

      const items = [];
      document.querySelectorAll('.item-row').forEach(row => {
        const material = row.querySelector('.material').value.trim();
        const kuantiti = parseFloat(row.querySelector('.kuantiti').value);
        const unit = row.querySelector('.unit').value.trim();
        if (material && kuantiti > 0) {
          items.push({ material, kuantiti, unit });
        }
      });

      if (items.length === 0) {
        messageDiv.style.color = "red";
        messageDiv.textContent = "Sila isi sekurang-kurangnya satu material dan kuantiti.";
        return;
      }

      messageDiv.style.color = "#1a73e8";
      messageDiv.textContent = "Sedang menghantar...";

      const formData = new FormData();
      formData.append('nama', nama);
      formData.append('tujuan', tujuan);
      formData.append('items', JSON.stringify(items));

      try {
        const response = await fetch(webAppUrl, { 
          method: 'POST', 
          body: formData 
        });
        const result = await response.text();

        if (result.includes("Berjaya") || result.includes("Success")) {
          messageDiv.style.color = "green";
          messageDiv.textContent = result || "Pinjaman berjaya dihantar!";
          setTimeout(() => location.reload(), 2500);
        } else {
          messageDiv.style.color = "red";
          messageDiv.textContent = result || "Ralat semasa menghantar.";
        }
      } catch (error) {
        messageDiv.style.color = "red";
        messageDiv.textContent = "Ralat sambungan. Semak internet anda.";
      }
    }

    // Load senarai material
    async function loadMaterialList() {
      try {
        const response = await fetch(webAppUrl + "?action=getMaterials");
        const materials = await response.json();

        const datalist = document.getElementById('materialList');
        datalist.innerHTML = '';

        materials.forEach(mat => {
          if (mat && mat.toString().trim() !== '') {
            const option = document.createElement('option');
            option.value = mat.toString().trim();
            datalist.appendChild(option);
          }
        });
      } catch (error) {
        console.error("Gagal load material:", error);
      }
    }

    window.addEventListener('load', loadMaterialList);
  </script>
</body>
</html>
